# Build docs/ as a static MyST site and publish it to GitHub Pages.
# Pages must be set to deploy from GitHub Actions (Settings -> Pages -> Source).
name: Deploy docs
on:
  push:
    branches: [main]
  workflow_dispatch:
# The site is served under /<repo-name>/, and myst needs to know that at build time.
env:
  BASE_URL: /${{ github.event.repository.name }}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The docs execute their CLI examples at build time; that needs the
      # Jupyter bash kernel and a docslice command on PATH.
      - run: |
          pip install jupyter-server bash_kernel
          python -m bash_kernel.install
      - run: npm ci
      - run: npm run build && npm install -g .
      - run: npm run docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
      - uses: actions/deploy-pages@v4
        id: deployment
