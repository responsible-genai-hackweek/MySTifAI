# Question bank: the MyST guide (mystmd.org/guide). The "scientist" here is an
# author publishing computational work with MyST. Schema and question-style
# guidance documented in cryocloud.yaml. Answers verified against the live
# site 2026-08-27.
#
# Caution when writing questions for this site: mystmd is widely documented, so
# answer keys must be genuinely site-specific (exact flags, exact defaults,
# exact config keys), not things a model could infer from knowing MyST generally.
site: https://mystmd.org/guide
questions:
  - id: execute-at-build
    source: https://mystmd.org/guide/execute-notebooks
    section: https://mystmd.org/guide/execute-notebooks
    grep: myst build --execute
    question: >
      I'm publishing notebooks with MyST and want their code to actually run
      during the site build instead of reusing stored outputs. How do I turn
      that on?
    answer: pass the --execute flag to myst start or myst build (e.g. myst build --execute)
    match: exact_fact
    notes: The --execute flag on build/start must be named.
  - id: clean-exec-command
    source: https://mystmd.org/guide/execute-notebooks
    section: https://mystmd.org/guide/execute-notebooks#force-execution-by-deleting-the-cache
    grep: myst clean --exec
    question: >
      My MyST site keeps showing stale computational outputs from the execution
      cache. What exact command forces re-execution of all my documents' code?
    answer: myst clean --exec
    match: exact_fact
    notes: Must be the clean subcommand with the --exec flag (not --execute).
  - id: matplotlib-strings-default
    source: https://mystmd.org/guide/settings
    section: https://mystmd.org/guide/settings#project-settings
    grep: remove-warn
    question: >
      My notebook cells produce string outputs like "<Figure size 720x576 with
      1 Axes>" above the plots. What does MyST do with these by default, and
      which project setting controls it?
    answer: "output_matplotlib_strings, default remove-warn (removed, with a logged warning)"
    match: must_include
    notes: >
      Must name the output_matplotlib_strings setting AND the remove-warn
      default (removing plus warning); "remove" or "warn" alone is partial.
  - id: gh-pages-base-url
    source: https://mystmd.org/guide/deployment-github-pages
    section: https://mystmd.org/guide/deployment-github-pages#example-a-full-github-action
    grep: "BASE_URL: /${{"
    question: >
      I deployed my MyST site to GitHub Pages from a project repository and the
      CSS and JS won't load. What value does the workflow generated by
      "myst init --gh-pages" set the BASE_URL environment variable to, so
      assets resolve under the repo's subpath?
    answer: "/${{ github.event.repository.name }}"
    match: exact_fact
    notes: >
      Must be the repository-name expression with a leading slash; whitespace
      inside the ${{ }} braces may vary.
  - id: launch-buttons
    source: https://mystmd.org/guide/website-launch-buttons
    section: https://mystmd.org/guide/website-launch-buttons#add-a-jupyter-server-launch-button
    grep: "jupyter: true"
    question: >
      I want readers of my MyST site to be able to launch each page in a
      Jupyter environment (JupyterHub or Binder). What project configuration
      adds the launch button?
    answer: "set jupyter: true in the project frontmatter (alongside a github: repository config)"
    match: must_include
    notes: >
      Must name the jupyter: true project config; mentioning the github config
      requirement is a bonus, not required.
